# Deploys the living window: every push rebuilds site/ and ships it to GitHub Pages.
# Because the shift workflow pushes after each run, the public site updates
# precisely because the AI worked. Enable Pages with source = "GitHub Actions".
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Gates + build
        run: |
          python3 tools/validate.py
          python3 tools/build.py
      - name: Visual-regression narration (P4.3 — always; screenshots best-effort)
        continue-on-error: true
        run: |
          python3 tools/vishot.py narrate
          python3 tools/vishot.py shoot || echo "vishot: capture skipped (no browser) — narration stands"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          # ADR-020: the first deploy CREATES the Pages site (source: Actions)
          # if it doesn't exist yet — replaces click-list item 1
          enablement: true
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
